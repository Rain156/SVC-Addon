# SVC Addon server configuration. Changes apply with /svcaddon reload.
# Distances are blocks. Levels are digital dBFS (-96 silence, 0 full scale), not physical dB SPL.
schema=1
range.dynamic=true
range.minimum=4
range.maximum=48
range.crouch=6
range.whisper=6
level.quiet-dbfs=-50
level.loud-dbfs=-10
level.attack-ms=60
level.release-ms=400
broadcast.cross-dimension=false

# Runs once per threshold crossing after the hold time; rearms 3 dB below the threshold.
# Only administrator-authored commands are accepted. {player} and {uuid} identify the speaker.
# Example: execute as {uuid} run say Please lower your microphone volume
threshold.enabled=false
threshold.dbfs=-8
threshold.hold-ms=500
threshold.cooldown-ms=5000
threshold.command=
