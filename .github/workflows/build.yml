name: Build and test

on:
  push:
    branches: [main, 'rain/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.minecraft }} / ${{ matrix.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '26.2']
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Build and run automated tests
        run: ./gradlew "-PgameVersion=${{ matrix.minecraft }}" "-Ploader=${{ matrix.loader }}" build --console=plain
      - name: Check packaged mod
        run: python3 scripts/verify_artifacts.py "${{ matrix.minecraft }}" "${{ matrix.loader }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: svcaddon-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: platforms/${{ matrix.loader }}/build/${{ matrix.minecraft }}/libs/svcaddon-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: diagnostics-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            **/build/**/reports/
            **/build/**/test-results/
            platforms/${{ matrix.loader }}/build/**/tmp/neoformruntime/
          retention-days: 7
