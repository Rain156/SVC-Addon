# SVC Addon server configuration
# Loudness values are dBFS (digital full scale), not calibrated real-world SPL.

# Dynamic voice distance
dynamic_range_enabled=true
noise_gate_dbfs=-55
noise_gate_hysteresis_db=3
quiet_dbfs=-42
loud_dbfs=-12
min_distance=4
max_distance=48
curve_exponent=1.4
rms_window_ms=100
attack_ms=80
release_ms=350
decoder_reset_gap_ms=500
whisper_distance_scale=0.35
whisper_max_distance=10

# Acoustic path tracing
path_tracing_enabled=true
allow_player_path_tracing_toggle=true
path_cache_ttl_ms=300
path_max_nodes=4096
path_search_timeout_ms=8
path_position_quantization=1
path_max_distance=64
path_search_margin=6
path_vertical_margin=3
path_max_snapshot_blocks=65536
path_requests_per_tick=2
path_queue_capacity=256
path_snapshot_budget_ms=1.5
path_turn_penalty=0.35
path_narrow_penalty=0.08
no_path_cancels_audio=true
blocked_attenuation_factor=0.05

# Diagnostics (rate-limited)
debug_enabled=false
debug_log_interval_ms=1000
